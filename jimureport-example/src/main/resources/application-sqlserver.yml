server:
  port: 8085
  tomcat:
    max-swallow-size: -1
spring:
  web:
    error:
      include-exception: true
      include-stacktrace: ALWAYS
      include-message: ALWAYS
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  #配置静态资源
  mvc:
    static-path-pattern: /**
  #配置数据库
  datasource:
    url: jdbc:sqlserver://127.0.0.1:1433;SelectMethod=cursor;DatabaseName=jimureport
    username: sa
    password: ???
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
#Minidao配置
minidao:
  base-package: org.jeecg.modules.jmreport.*,org.jeecg.modules.drag.*,org.jeecg.modules.chat2bi.*
#JimuReport[上传配置]
jeecg:
  # local|minio|alioss
  uploadType: oss
  # local
  path:
    #文件路径
    upload: /opt/upload
  # alioss
  oss:
    accessKey: ??
    secretKey: ??
    endpoint: oss-cn-beijing.aliyuncs.com
    bucketName: jeecgdev
  # minio
  minio:
    minio_url: http://minio.jeecg.com
    minio_name: ??
    minio_pass: ??
    bucketName: ??
  #大屏报表参数设置
  jmreport:
    # 接口加签密钥(示例值随开源仓库公开，部署前请替换为自己的随机值)
    signatureSecret: 8eb822f33347bfd3558fef0cd366b8e58bb8b7228d10fd35
    # 平台上线安全配置
    firewall:
      # Api数据集内网ip白名单（支持IP/CIDR网段/域名，非字面量IP会按域名精确匹配处理），仅在apiDsIpCheck=true时生效
      apiDsIpWhite:
        - api.jeecg.com
        - bootapi.jeecg.com
#输出sql日志
logging:
  level:
    org.jeecg.modules.jmreport: info
